# Purple Computer: ipp-usb serves the printer to CUPS on loopback only and
# never announces it, so avahi stays masked and nothing touches a network.
[network]
  http-min-port = 60000
  http-max-port = 65535
  dns-sd = disable
  interface = loopback
  ipv6 = disable

[logging]
  device-log = error
  main-log = error
  console-log = error
  max-file-size = 256K
  max-backup-files = 1
