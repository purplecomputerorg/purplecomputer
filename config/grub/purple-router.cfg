# Picks the kernel for this machine. Sourced by the ISO and installed grub.cfg,
# which boot vmlinuz$purple_variant with $purple_args appended.
#   ""     signed stock kernel (default, and every failure path lands here)
#   -t2    t2linux kernel: 2018-2020 Macs need apple-bce for keyboard and audio
#   -i386  32-bit CPU, no long mode: Debian i386 image, install-only
# See guides/hardware-coverage-plan.md.
set purple_variant=""
set purple_args=""
if insmod cpuid; then
    if ! cpuid -l; then
        set purple_variant=-i386
    fi
fi
if [ -z "$purple_variant" ]; then
    if insmod smbios; then
        if insmod regexp; then
            smbios --type 1 --get-string 0x05 --set product
            if regexp '^(MacBookPro1[56]|MacBookAir[89]|Macmini8|iMacPro1|iMac20|MacPro7),' "$product"; then
                set purple_variant=-t2
                set purple_args="pm_async=off intel_iommu=on iommu=pt"
            fi
        fi
    fi
fi
