# PulseAudio profile set for a card whose speakers have no hardware volume:
# mappings without mixer paths make Pulse apply every volume change in software.
# Selected per card by config/udev/91-purple-mac-audio.rules.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f hw:%f
channel-map = left,right
direction = output

[Mapping analog-stereo-input]
device-strings = hw:%f
channel-map = left,right
direction = input
