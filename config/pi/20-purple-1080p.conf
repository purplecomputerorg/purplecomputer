# Raspberry Pi: run X at 1080p even on a 4K screen (the screen upscales). Purple
# draws in software, and at 3840x2160 a Pi 400 took ~180ms per frame to draw and
# display versus ~45ms at 1080p. A screen without a 1080p mode keeps its own.
Section "Monitor"
    Identifier "HDMI-1"
    Option "PreferredMode" "1920x1080"
EndSection

Section "Monitor"
    Identifier "HDMI-2"
    Option "PreferredMode" "1920x1080"
EndSection
