# Purple Computer keyd configuration.
#
# Why:
#  - grave/tilde -> Escape: kids reach the top-left corner key more easily
#    than Escape, and this needs to work before Purple starts (rescue shells,
#    boot hangs) so it can't live in Python.
#  - rightalt -> F2: Touch Bar MacBooks have no physical F-keys, so there
#    is no other way to type Ctrl+Alt+F2 to reach tty2 on that hardware.
#  - Ctrl+Alt+F2 (or Ctrl+Alt+RightAlt) must be held 3s: kids mashing the
#    bottom corners hit it instantly. Lives here, not in Purple, so it still
#    works when Purple is hung. F3-F6 do nothing: a kid can't get back from them.
#
# Format: https://github.com/rvaiya/keyd

[ids]
*

[main]
grave = esc
102nd = esc
rightalt = f2

# Bindings in a modifier layer drop its modifiers, so the hold sends them itself.
[control+alt]
rightalt = timeout(noop, 3000, C-A-f2)
f2 = timeout(noop, 3000, C-A-f2)
f3 = noop
f4 = noop
f5 = noop
f6 = noop
