# Kernel variant data shared by purple-router.cfg (GRUB, via source) and
# build-scripts/install.sh (bash, via eval). Keep every line `set name=value`.
set purple_t2_models='^(MacBookPro1[56]|MacBookAir[89]|Macmini8|iMacPro1|iMac20|MacPro7),'
set purple_t2_args="pm_async=off intel_iommu=on iommu=pt"
# MacBookAir3,x and MacBook5,2 (Core 2 + Nvidia chipset): the idle CPU is not
# woken by its own timer early in boot, which adds ~3 min the kernel clock never
# sees. See docs/PLAN-macbook5-slow-boot.md.
set purple_c2mac_models='^(MacBookAir3,|MacBook5,2)'
set purple_c2mac_args="nolapic_timer"
# Some of these netbooks report the lid closed at boot until it is moved.
set purple_i386_args="button.lid_init_state=open"
